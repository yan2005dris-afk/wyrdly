name: Backend CI Pipeline

on:
  push:
    branches: [develop, main]
    paths:
      - 'wyrdly-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'wyrdly-backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw spotless:check

  unit-test:
    name: Unit Tests (Surefire)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/placeholder_password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p placeholder_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw test

  coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/placeholder_password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p placeholder_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw test jacoco:report

  integration-test:
    name: Integration Tests (Failsafe)
    runs-on: ubuntu-latest
    # No Neo4j service: the ITs start their own container through Testcontainers
    # (the runner's Docker), migrated with the production migrations.
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      # -DskipITs=false makes the *IT suites (Testcontainers) run explicitly;
      # they share one migrated Neo4j container, also injected into the
      # packaged app booted by @QuarkusIntegrationTest via Neo4jTestResource.
      - run: ./mvnw verify -DskipUnitTests -DskipITs=false

  build:
    name: Package Build (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw package -DskipTests

  native-build:
    name: Native Build (Mandrel / quarkus-micro-image)
    # Target startup is <1s on the native runner; we use a 30-second budget
    # so a runaway Mandrel build (e.g. transitive native-image metadata fetch
    # through a corporate proxy) fails fast instead of dragging the job to
    # the 6-hour CI ceiling. Set to 60s+ only if debugging a specific stall.
    runs-on: ubuntu-latest
    container:
      # Public Mandrel 23 image (UBI9 base, JDK 21). The legacy
      # `mandrel-for-jdk-21-rhel8:latest` requires Red Hat Registry auth that
      # this repo does not have, so we use the official Quarkus-republished
      # UBI9 build image instead (namespace `quarkus`, NOT `quarkusio`).
      # Mandrel 23 is what Quarkus 3.20 LTS bundles by default and pairs with
      # this project's JDK 21 build target.
      image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:23.1.12.1-Final-java21-2026-09-27
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # Explicit Maven cache because the Mandrel container owns its own
      # ~/.m2 ephemeral filesystem and `setup-java` cache-maven alone
      # would not survive a `container:` job. Key includes both the pom and
      # the wrapper so a wrapper bump invalidates the cache too.
      - name: Cache Maven local repo (~/.m2)
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-native-build-${{ runner.os }}-${{ hashFiles('wyrdly-backend/pom.xml', 'wyrdly-backend/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-native-build-${{ runner.os }}-
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - name: Make mvnw executable
        run: chmod +x ./mvnw
      - name: Native package
        run: ./mvnw -B -e -ntp -DskipTests package -Dnative
      - name: Smoke test (runner boots, /q/health/live OK)
        run: |
          ./target/wyrdly-backend-*-runner &
          RUNNER_PID=$!
          for i in $(seq 1 30); do
            if wget -qO- http://127.0.0.1:8080/q/health/live > /dev/null 2>&1; then
              echo "Native runner healthy after ${i}s"
              STARTUP=$i
              break
            fi
            sleep 1
          done
          if [ -z "${STARTUP:-}" ]; then
            echo "ERROR: native runner did not respond on /q/health/live within 30s" >&2
            kill $RUNNER_PID 2>/dev/null || true
            exit 1
          fi
          kill $RUNNER_PID 2>/dev/null || true
          wait $RUNNER_PID 2>/dev/null || true
      - name: Native binary size
        run: ls -la ./target/wyrdly-backend-*-runner
