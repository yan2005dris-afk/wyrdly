name: Backend CI Pipeline

on:
  push:
    branches: [develop, main]
    paths:
      - 'wyrdly-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'wyrdly-backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw spotless:check

  unit-test:
    name: Unit Tests (Surefire)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/placeholder_password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p placeholder_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw test

  coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/placeholder_password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p placeholder_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw test jacoco:report

  integration-test:
    name: Integration Tests (Failsafe)
    runs-on: ubuntu-latest
    # No Neo4j service: the ITs start their own container through Testcontainers
    # (the runner's Docker), migrated with the production migrations.
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      # -DskipITs=false makes the *IT suites (Testcontainers) run explicitly;
      # they share one migrated Neo4j container, also injected into the
      # packaged app booted by @QuarkusIntegrationTest via Neo4jTestResource.
      - run: ./mvnw verify -DskipUnitTests -DskipITs=false

  build:
    name: Package Build (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wyrdly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Generate JWT Keys
        run: bash ../scripts/generate-jwt-keys.sh src/main/resources/jwt
      - run: ./mvnw package -DskipTests
