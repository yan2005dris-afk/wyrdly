# Wyrdly production deployment on the dedicated self-hosted runner.
# Runtime configuration lives outside the checkout or in local .env.
name: Deploy Wyrdly

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: wyrdly-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, wyrdly]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Determine environment configuration
        id: config
        run: |
          if [ -r /etc/wyrdly/.env ]; then
            env_file=/etc/wyrdly/.env
            echo "Using system environment file: $env_file"
          elif [ -r .env ]; then
            env_file=.env
            echo "Using repository environment file: $env_file"
          else
            echo "ERROR: required environment file (/etc/wyrdly/.env or .env) is absent or unreadable."
            exit 1
          fi
          # Source the env file once so subsequent steps can read everything
          # they need through step outputs (GitHub Actions does not propagate
          # shell-loaded vars across steps).
          # shellcheck disable=SC1090
          set -a; . "$env_file"; set +a

          # Compose profile flags based on CLOUDFLARE_ENABLED (default: false).
          if [ "${CLOUDFLARE_ENABLED:-false}" = "true" ]; then
            compose_profiles="--profile cloudflare"
          else
            compose_profiles=""
          fi
          jwt_dir="${JWT_KEYS_DIR:-/etc/wyrdly/jwt}"

          {
            echo "env_file=$env_file"
            echo "compose_profiles=$compose_profiles"
            echo "jwt_dir=$jwt_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Validate required production env vars
        env:
          ENV_FILE: ${{ steps.config.outputs.env_file }}
        run: |
          set -eu
          # These vars MUST be set when QUARKUS_PROFILE=prod. Failing here is
          # cheaper than discovering it at compose-up time.
          required=(
            NEO4J_PASSWORD
            RUSTFS_ACCESS_KEY
            RUSTFS_SECRET_KEY
            CORS_ORIGINS
            APP_PUBLIC_BASE_URL
            JWT_ISSUER
            VAPID_SUBJECT
            # VITE_BACKEND_URL / VITE_WS_URL are baked into the frontend bundle
            # but never used at runtime when Nginx reverse-proxies /api and /ws.
            # CLOUDFLARE_TUNNEL_TOKEN is only required when the cloudflare
            # profile is active. Validate it conditionally below.
          )
          missing=()
          # shellcheck disable=SC1090
          set -a; . "$ENV_FILE"; set +a
          for v in "${required[@]}"; do
            if [ -z "${!v:-}" ]; then
              missing+=("$v")
            fi
          done

          # CLOUDFLARE_TUNNEL_TOKEN is only required when the cloudflare profile
          # is in use. If the operator opted in, the value must be set.
          if [ "${CLOUDFLARE_ENABLED:-false}" = "true" ] && [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            missing+=("CLOUDFLARE_TUNNEL_TOKEN (CLOUDFLARE_ENABLED=true)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: missing required production variables:"
            for m in "${missing[@]}"; do echo "  - $m"; done
            echo ""
            echo "See .env.prod for the expected values."
            exit 1
          fi

          # URL-safety check on the auto-generated secrets. Neo4j parses
          # NEO4J_AUTH=user/password with split('/') and only the first two
          # tokens survive — a '/' in the password crashes the container in
          # a restart loop (see odd/tasks/fix-neo4j-auth-password-format.md).
          # '+' breaks both the S3 client JSON parser and the .env round-trip
          # for RUSTFS_SECRET_KEY. Reject any non-portable char and point the
          # operator at the bootstrap generator, which already uses
          # openssl rand -hex (URL-safe alphabet only).
          #
          # This only runs in CI; local docker compose up won't catch this
          # until Neo4j is up, so a fast-fail here saves a debug round.
          bad_chars='[/+]'
          for v in NEO4J_PASSWORD RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY; do
            if [[ "${!v}" == *${bad_chars}* ]]; then
              echo "ERROR: $v contains '/' or '+'. Regenerate with:"
              case "$v" in
                NEO4J_PASSWORD)     echo "  openssl rand -hex 24" ;;
                RUSTFS_ACCESS_KEY)  echo "  openssl rand -hex 16" ;;
                RUSTFS_SECRET_KEY)  echo "  openssl rand -hex 32" ;;
              esac
              exit 1
            fi
          done

          echo "All required vars present and URL-safe."

      - name: Ensure external JWT keys exist
        run: |
          set -eu
          jwt_dir="${{ steps.config.outputs.jwt_dir }}"
          if ! mkdir -p "$jwt_dir"; then
            echo "ERROR: runner cannot create or access $jwt_dir."
            exit 1
          fi
          if [ ! -f "$jwt_dir/privateKey.pem" ] || [ ! -f "$jwt_dir/publicKey.pem" ]; then
            echo "Generating RSA 2048-bit PKCS8 JWT keys in $jwt_dir..."
            openssl genrsa -out "$jwt_dir/privateKey.raw.pem" 2048 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform PEM -in "$jwt_dir/privateKey.raw.pem" -out "$jwt_dir/privateKey.pem" -nocrypt
            rm -f "$jwt_dir/privateKey.raw.pem"
            openssl rsa -in "$jwt_dir/privateKey.pem" -pubout -out "$jwt_dir/publicKey.pem" 2>/dev/null
          else
            echo "JWT keys already exist in $jwt_dir."
          fi
          chmod 644 "$jwt_dir/publicKey.pem" "$jwt_dir/privateKey.pem"

      - name: Build and deploy services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          docker compose --env-file "${{ steps.config.outputs.env_file }}" \
                         ${{ steps.config.outputs.compose_profiles }} \
                         up -d --build --remove-orphans

      - name: Show deployment status
        env:
          ENV_FILE: ${{ steps.config.outputs.env_file }}
        run: |
          docker compose --env-file "$ENV_FILE" \
                         ${{ steps.config.outputs.compose_profiles }} \
                         ps

      - name: Clean up old images
        run: |
          # Keep images younger than 168h (1 week) so rollback to a previous
          # build still has the corresponding image available, without
          # letting the daemon accumulate old builds indefinitely.
          docker image prune -f --filter "until=168h"