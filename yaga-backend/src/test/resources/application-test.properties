# Test Profile - HTTP Port (dynamic to avoid conflicts with running containers)
quarkus.http.port=0

# Test Profile - Neo4j Credentials (same as Docker)
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.username=neo4j
quarkus.neo4j.authentication.password=password

# Disable migrations in test
yaga.database.migration.enabled=false
yaga.database.seed.enabled=false

# Disable rate limiting for tests
yaga.rate-limit.history.requests-per-minute=10000
