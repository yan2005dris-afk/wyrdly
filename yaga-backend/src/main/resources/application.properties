# Configuración de Servidor Quarkus
quarkus.http.port=${BACKEND_PORT:8080}
# Lazy auth: solo valida JWT en endpoints anotados con @Authenticated/@RolesAllowed.
# Necesario para rutas públicas con auth opcional (GET /api/users/{username}) que no deben
# romperse si llega un token invalido/expirado en el header Authorization.
quarkus.http.auth.proactive=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, cookie
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# Conexión Oficial a Neo4j 5.x
quarkus.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
quarkus.neo4j.authentication.password=${NEO4J_PASSWORD:placeholder_password}

# Configuración de Seguridad SmallRye JWT y Cookies
mp.jwt.verify.issuer=${JWT_ISSUER:https://yaga-social.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
quarkus.smallrye-jwt.enabled=true
yaga.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
yaga.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:LAX}
yaga.auth.cookie.refresh-token-name=refreshToken
yaga.auth.cookie.max-age=${AUTH_REFRESH_TOKEN_MAX_AGE:604800}

# Configuración de RustFS / S3
rustfs.endpoint=${RUSTFS_ENDPOINT:http://localhost:9000}
rustfs.access-key=${RUSTFS_ACCESS_KEY:placeholder_key}
rustfs.secret-key=${RUSTFS_SECRET_KEY:placeholder_secret}
rustfs.bucket=${RUSTFS_BUCKET:social-media-assets}

# Configuración de Migraciones Automáticas Neo4j (neo4j-migrations)
org.neo4j.migrations.packages-to-scan=neo4j.migrations
org.neo4j.migrations.locations-to-scan=classpath:neo4j/migrations
org.neo4j.migrations.autocrlf=true

# Habilitar Migraciones y Seeder
yaga.database.migration.enabled=true
%test.yaga.database.migration.enabled=false
%dev.yaga.database.seed.enabled=true
yaga.database.seed.enabled=${YAGA_SEED_ENABLED:false}

