# =============================================================================
# Wyrdly — Quarkus configuration
# -----------------------------------------------------------------------------
# Defaults here are SAFE FOR LOCAL DEV (fast iteration, lenient cookies, dev
# CORS, seed data enabled). Production overrides live in the %prod. block at
# the bottom of this file and are activated by:
#
#   QUARKUS_PROFILE=prod   (compose.yaml injects this in production)
#
# Required prod env vars (no dev fallback): CORS_ORIGINS, APP_PUBLIC_BASE_URL,
# JWT_ISSUER, VAPID_SUBJECT. The backend will fail closed if they are missing.
# =============================================================================

# ─── HTTP server ────────────────────────────────────────────────────────────
quarkus.http.port=${BACKEND_PORT:8080}
# Lazy auth: only validate JWT on endpoints annotated with @Authenticated/@RolesAllowed.
# Needed for routes with optional auth (GET /api/users/{username}) that must not
# break when an invalid/expired token arrives in the Authorization header.
quarkus.http.auth.proactive=true

# ─── CORS ───────────────────────────────────────────────────────────────────
# Dev default: localhost + the prod origin so the SPA works against either.
# In prod (see %prod. block), CORS_ORIGINS is REQUIRED and overrides this value.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173,https://wyrdly.yandro.tech}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, cookie, idempotency-key
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# ─── Reverse proxy / forwarded headers ──────────────────────────────────────
# Honour X-Forwarded-* from Cloudflare, Nginx, load balancers.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# ─── Neo4j driver ───────────────────────────────────────────────────────────
quarkus.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
quarkus.neo4j.authentication.password=${NEO4J_PASSWORD:password}
quarkus.neo4j.pool.metrics.enabled=true
quarkus.neo4j.pool.max-connection-pool-size=${NEO4J_MAX_POOL_SIZE:300}
quarkus.neo4j.pool.log-leaked-sessions=true
# HU09 — reactions target ≥ 5.000 concurrent reactions.
quarkus.neo4j.pool.connection-acquisition-timeout=30s
quarkus.neo4j.pool.idle-time-before-connection-test=60s

# ─── SmallRye JWT + auth cookies ────────────────────────────────────────────
mp.jwt.verify.issuer=${JWT_ISSUER:https://wyrdly.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
quarkus.smallrye-jwt.enabled=true

# Cookies: secure by default in prod (override is %prod. block).
wyrdly.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
wyrdly.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
wyrdly.auth.cookie.refresh-token-name=refreshToken
wyrdly.auth.cookie.path=${AUTH_COOKIE_PATH:/}
wyrdly.auth.cookie.max-age=${AUTH_REFRESH_TOKEN_MAX_AGE:604800}

# ─── RustFS / S3 ────────────────────────────────────────────────────────────
rustfs.endpoint=${RUSTFS_ENDPOINT:http://localhost:9000}
rustfs.access-key=${RUSTFS_ACCESS_KEY:placeholder_key}
rustfs.secret-key=${RUSTFS_SECRET_KEY:placeholder_secret}
rustfs.bucket=${RUSTFS_BUCKET:social-media-assets}
rustfs.region=${RUSTFS_REGION:us-east-1}
rustfs.force-path-style=${RUSTFS_FORCE_PATH_STYLE:true}

# ─── Neo4j migrations ───────────────────────────────────────────────────────
org.neo4j.migrations.packages-to-scan=neo4j.migrations
org.neo4j.migrations.locations-to-scan=classpath:neo4j/migrations
org.neo4j.migrations.autocrlf=true

wyrdly.database.migration.enabled=true
%test.wyrdly.database.migration.enabled=false

# ─── Seeder ─────────────────────────────────────────────────────────────────
# Off by default; .env.prod keeps it off; .env.dev enables it.
%dev.wyrdly.database.seed.enabled=true
wyrdly.database.seed.enabled=${WYRDLY_SEED_ENABLED:false}

# ─── Media uploads ───────────────────────────────────────────────────────────────────
media.bucket.name=${RUSTFS_BUCKET:social-media-assets}
media.max-file-size=10485760
# Frontend converts every accepted input to WebP before upload; the
# backend now only accepts image/webp. MP4 / video support will land
# in a follow-up ticket with its own pipeline.
media.allowed-mime-types=image/webp

# ─── Public base URL ────────────────────────────────────────────────────────
# Used by MediaService to build absolute URLs returned in MediaUploadResponse.fileUrl.
# Required so CreatePostRequest @URL validation (http/https) accepts them.
# Override per environment, e.g. https://api.wyrdly.app in prod.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# ─── Redis ──────────────────────────────────────────────────────────────────
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=2s

# ─── Vert.x thread pool ─────────────────────────────────────────────────────
# Sized to absorb reaction fan-out at p95 < 80 ms.
quarkus.thread-pool.core-threads=100
quarkus.thread-pool.max-threads=500
quarkus.thread-pool.queue-size=5000

# ─── Metrics (Prometheus) ───────────────────────────────────────────────────
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

# ─── Cache + rate limiting ──────────────────────────────────────────────────
wyrdly.cache.follow.ttl.seconds=${FOLLOW_CACHE_TTL_SECONDS:300}
wyrdly.rate-limit.history.requests-per-minute=${RATE_LIMIT_HISTORY_REQUESTS_PER_MINUTE:60}

# Reactions rate-limit / idempotency tuning (consumed by JAX-RS filters).
wyrdly.reactions.rate-limit.capacity=30
wyrdly.reactions.rate-limit.window-seconds=60
wyrdly.reactions.idempotency.ttl-seconds=1

# Jackson: configured in code, see com.wyrdly.infrastructure.jackson.StrictObjectMapperCustomizer

# ─── Tests ──────────────────────────────────────────────────────────────────
# Disable idempotency caching to prevent test interference.
%test.wyrdly.reactions.idempotency.ttl-seconds=0

# =========================================================================
# HU11 — Web Push VAPID (RFC 8292). Keypair bootstrap (TASK-01 / #62).
# =========================================================================
wyrdly.push.vapid.subject=${VAPID_SUBJECT:mailto:ops@wyrdly.com}
wyrdly.push.vapid.public-key-location=${VAPID_PUBLIC_KEY_LOCATION:vapid/publicKey.txt}
wyrdly.push.vapid.private-key-location=${VAPID_PRIVATE_KEY_LOCATION:vapid/privateKey.txt}
wyrdly.push.vapid.generate-if-missing=${VAPID_GENERATE_IF_MISSING:true}

# Tests run on a tempdir managed by @TempDir; never write to the project tree.
%test.wyrdly.push.vapid.public-key-location=${java.io.tmpdir}/vapid-test/publicKey.txt
%test.wyrdly.push.vapid.private-key-location=${java.io.tmpdir}/vapid-test/privateKey.txt
%test.wyrdly.push.vapid.generate-if-missing=true

# Tight dispatcher settings so @QuarkusTest scenarios don't sleep for seconds.
wyrdly.push.dispatch.global-rate-per-second=${PUSH_DISPATCH_GLOBAL_RATE:1000}
wyrdly.push.dispatch.recipient-rate-interval-ms=${PUSH_DISPATCH_RECIPIENT_INTERVAL_MS:1000}
%test.wyrdly.push.dispatch.max-retries=2
%test.wyrdly.push.dispatch.initial-backoff-ms=10
%test.wyrdly.push.dispatch.global-rate-per-second=1000
%test.wyrdly.push.dispatch.recipient-rate-interval-ms=1000

# HU11 — Dispatcher pool + follower fan-out (TASK-04 / #32). The queue is bounded so a large
# fan-out cannot exhaust the heap; pushes beyond capacity are dropped (result=rejected).
wyrdly.push.dispatch.pool-size=${PUSH_DISPATCH_POOL_SIZE:8}
wyrdly.push.dispatch.queue-capacity=${PUSH_DISPATCH_QUEUE_CAPACITY:5000}
wyrdly.push.fanout.batch-size=${PUSH_FANOUT_BATCH_SIZE:200}
wyrdly.push.fanout.max-recipients=${PUSH_FANOUT_MAX_RECIPIENTS:10000}


# =========================================================================
# %prod. — Production overrides (fail closed)
# ----------------------------------------------------------------------------
# Activated by QUARKUS_PROFILE=prod (compose.yaml sets this in production).
# Anything mandatory in prod is referenced WITHOUT a default — if the env var
# is missing, Quarkus fails fast at startup instead of falling back to a
# localhost/dev value.
# =========================================================================
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
%prod.wyrdly.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
%prod.wyrdly.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
%prod.app.public-base-url=${APP_PUBLIC_BASE_URL}
%prod.mp.jwt.verify.issuer=${JWT_ISSUER}
%prod.wyrdly.database.seed.enabled=${WYRDLY_SEED_ENABLED:false}
%prod.wyrdly.push.vapid.subject=${VAPID_SUBJECT}
# In prod, generate-if-missing must be set explicitly via VAPID_GENERATE_IF_MISSING
# (.env.prod defaults it to false).
%prod.wyrdly.push.vapid.generate-if-missing=${VAPID_GENERATE_IF_MISSING:false}

# Stricter log level in prod — DEBUG leaks PII and query plans.
%prod.quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
# %prod. log format: uses Quarkus DEFAULT. Override via QUARKUS_LOG_CONSOLE_FORMAT env var.
# %prod.quarkus.log.console.format=${QUARKUS_LOG_CONSOLE_FORMAT:%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2}] (%t) %s%e%n}

# Health endpoints — never expose Dev UI in prod.
%prod.quarkus.dev-ui.enabled=false
# Do not enable management endpoints on the public port.
%prod.quarkus.smallrye-health.root-path=/q/health
# Bind Neo4j driver strictly via TLS if Neo4j itself is terminated TLS.
%prod.quarkus.neo4j.pool.connection-acquisition-timeout=15s
%prod.quarkus.neo4j.pool.idle-time-before-connection-test=120s