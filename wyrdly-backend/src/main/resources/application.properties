# Configuración de Servidor Quarkus
quarkus.http.port=${BACKEND_PORT:8080}
# Lazy auth: solo valida JWT en endpoints anotados con @Authenticated/@RolesAllowed.
# Necesario para rutas públicas con auth opcional (GET /api/users/{username}) que no deben
# romperse si llega un token invalido/expirado en el header Authorization.
quarkus.http.auth.proactive=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, cookie
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# Conexión Oficial a Neo4j 5.x
quarkus.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
quarkus.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
quarkus.neo4j.authentication.password=${NEO4J_PASSWORD:password}
quarkus.neo4j.pool.metrics.enabled=true
quarkus.neo4j.pool.max-connection-pool-size=${NEO4J_MAX_POOL_SIZE:100}
quarkus.neo4j.pool.log-leaked-sessions=true

# Configuración de Seguridad SmallRye JWT y Cookies
mp.jwt.verify.issuer=${JWT_ISSUER:https://wyrdly.com/issuer}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:jwt/privateKey.pem}
quarkus.smallrye-jwt.enabled=true
wyrdly.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
wyrdly.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:LAX}
wyrdly.auth.cookie.refresh-token-name=refreshToken
wyrdly.auth.cookie.max-age=${AUTH_REFRESH_TOKEN_MAX_AGE:604800}

# Configuración de RustFS / S3
rustfs.endpoint=${RUSTFS_ENDPOINT:http://localhost:9000}
rustfs.access-key=${RUSTFS_ACCESS_KEY:placeholder_key}
rustfs.secret-key=${RUSTFS_SECRET_KEY:placeholder_secret}
rustfs.bucket=${RUSTFS_BUCKET:social-media-assets}

# Configuración de Migraciones Automáticas Neo4j (neo4j-migrations)
org.neo4j.migrations.packages-to-scan=neo4j.migrations
org.neo4j.migrations.locations-to-scan=classpath:neo4j/migrations
org.neo4j.migrations.autocrlf=true

# Habilitar Migraciones y Seeder
wyrdly.database.migration.enabled=true
%test.wyrdly.database.migration.enabled=false
%dev.wyrdly.database.seed.enabled=true
wyrdly.database.seed.enabled=${WYRDLY_SEED_ENABLED:false}

# Media Upload Configuration
media.bucket.name=${RUSTFS_BUCKET:social-media-assets}
media.max-file-size=10485760
# Frontend converts every accepted input to WebP before upload; the
# backend now only accepts image/webp. MP4 / video support will land
# in a follow-up ticket with its own pipeline.
media.allowed-mime-types=image/webp

# Public base URL of the backend. Used by MediaService to build
# absolute URLs returned in MediaUploadResponse.fileUrl. Required so
# CreatePostRequest @URL validation (http/https) accepts them.
# Override per environment, e.g. https://api.wyrdly.app in prod.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Redis (idempotencia + rate-limit). HU09 — sistema de reacciones.
quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
quarkus.redis.timeout=2s

# Neo4j pool — HU09 targets ≥ 5.000 concurrent reactions.
quarkus.neo4j.pool.max-connection-pool-size=300
quarkus.neo4j.pool.connection-acquisition-timeout=30s
quarkus.neo4j.pool.idle-time-before-connection-test=60s

# Vert.x thread pool — sized to absorb reaction fan-out at p95 < 80 ms.
quarkus.thread-pool.core-threads=100
quarkus.thread-pool.max-threads=500
quarkus.thread-pool.queue-size=5000

# Métricas Prometheus
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

# Cache de Follow Validation (TTL en segundos)
wyrdly.cache.follow.ttl.seconds=${FOLLOW_CACHE_TTL_SECONDS:300}
wyrdly.rate-limit.history.requests-per-minute=${RATE_LIMIT_HISTORY_REQUESTS_PER_MINUTE:60}

# Reactions rate-limit / idempotency tuning (consumed by JAX-RS filters).
wyrdly.reactions.rate-limit.capacity=30
wyrdly.reactions.rate-limit.window-seconds=60
wyrdly.reactions.idempotency.ttl-seconds=1

# Jackson configuration: strict deserialization
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.fail-on-empty-beans=false
quarkus.jackson.fail-on-null-for-primitives=true
quarkus.jackson.fail-on-trailing-tokens=false
quarkus.jackson.write-dates-as-timestamps=false

# Strict enum handling
quarkus.jackson.accept-case-insensitive-enums=false

# Test profile: disable idempotency caching to prevent test interference
%test.wyrdly.reactions.idempotency.ttl-seconds=0

