services:
  yaga-neo4j:
    image: docker.io/library/neo4j:5.26-community
    container_name: yaga-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
    volumes:
      - neo4j_data:/data:Z
      - neo4j_logs:/logs:Z
    networks:
      - yaga-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  yaga-rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: yaga-rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000" # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001" # Web Console UI
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data:Z
    networks:
      - yaga-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  yaga-backend:
    build:
      context: ./yaga-backend
      dockerfile: Dockerfile
    container_name: yaga-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://yaga-neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-http://yaga-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-social-media-assets}
      - YAGA_SEED_ENABLED=${YAGA_SEED_ENABLED:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
    depends_on:
      yaga-neo4j:
        condition: service_healthy
      yaga-rustfs:
        condition: service_healthy
    networks:
      - yaga-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/q/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  yaga-frontend:
    build:
      context: ./yaga-frontend
      dockerfile: Dockerfile
    container_name: yaga-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      yaga-backend:
        condition: service_healthy
    networks:
      - yaga-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  neo4j_data:
    name: yaga_neo4j_data
  neo4j_logs:
    name: yaga_neo4j_logs
  rustfs_data:
    name: yaga_rustfs_data

networks:
  yaga-network:
    name: yaga-network
    driver: bridge
