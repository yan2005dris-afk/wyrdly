services:
  wyrdly-neo4j:
    image: docker.io/library/neo4j:5.26-community
    container_name: wyrdly-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # HTTP Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
    volumes:
      - neo4j_data:/data:Z
      - neo4j_logs:/logs:Z
    networks:
      - wyrdly-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  wyrdly-rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: wyrdly-rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000" # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001" # Web Console UI
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data:Z
    networks:
      - wyrdly-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wyrdly-redis:
    image: redis:7-alpine
    container_name: wyrdly-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - wyrdly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  wyrdly-backend:
    build:
      context: ./wyrdly-backend
      dockerfile: Dockerfile
    container_name: wyrdly-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://wyrdly-neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-http://wyrdly-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-social-media-assets}
      - WYRDLY_SEED_ENABLED=${WYRDLY_SEED_ENABLED:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      - REDIS_HOSTS=${REDIS_HOSTS:-redis://wyrdly-redis:6379}
    depends_on:
      wyrdly-neo4j:
        condition: service_healthy
      wyrdly-rustfs:
        condition: service_healthy
      wyrdly-redis:
        condition: service_healthy
    networks:
      - wyrdly-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/q/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wyrdly-frontend:
    build:
      context: ./wyrdly-frontend
      dockerfile: Dockerfile
    container_name: wyrdly-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      wyrdly-backend:
        condition: service_healthy
    networks:
      - wyrdly-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  wyrdly-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wyrdly-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - wyrdly-network

volumes:
  neo4j_data:
    name: wyrdly_neo4j_data
    driver: local
  neo4j_logs:
    name: wyrdly_neo4j_logs
    driver: local
  rustfs_data:
    name: wyrdly_rustfs_data
    driver: local

networks:
  wyrdly-network:
    name: wyrdly-network
    driver: bridge
