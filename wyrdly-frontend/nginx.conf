server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SSE reverse proxy (long-lived, no buffering).
    # MUST be declared before the generic /api/ block so Nginx's prefix
    # match picks this exact match first. Without proxy_buffering off, Nginx
    # buffers the stream and the browser sees nothing until the buffer fills
    # or the 60s read timeout kills the connection.
    location = /api/notifications/stream {
        proxy_pass http://wyrdly-backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://wyrdly-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        # Lift the 60s default for long-running endpoints that are not SSE.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket reverse proxy
    location /ws/ {
        proxy_pass http://wyrdly-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 24h covers any reasonable WS lifetime. Without this, Nginx kills
        # the WS after 60s with the default proxy_read_timeout.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
